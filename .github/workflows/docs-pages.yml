name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths: [ "src/**", "docs/**", ".github/workflows/docs-pages.yml" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, not cancelling in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate Doxygen documentation
        working-directory: docs/doxygen
        run: doxygen Doxyfile

      - name: Show warnings summary
        if: ${{ failure() || success() }}
        working-directory: docs/doxygen
        run: |
          if [ -f html/warnings.log ]; then
            echo "Doxygen warnings: $(wc -l < html/warnings.log)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/doxygen/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
